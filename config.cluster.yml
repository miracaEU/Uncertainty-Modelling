# Cluster (Linux) configuration for the MIRACA uncertainty-modeling pipeline.
#
# Identical to config.yml except that every input path is the Linux form of the
# same SCISTOR storage: the S:\ drive on Windows is /scistor/ivm on the cluster,
# so "S:/eks510/..." becomes "/scistor/ivm/eks510/...". The shared input data
# (exposure, hazards, curve/fragility tables) stays under eks510; only the repo
# and its outputs live in your own folder.
#
# Select it with the MIRACA_CONFIG environment variable, so the tracked
# config.yml stays untouched (no git diff, nothing to un-stage before a pull):
#
#   export MIRACA_CONFIG=/scistor/ivm/yma794/Uncertainty-Modelling/config.cluster.yml
#
# submit_miraca_uncertainty_study.sh exports this for you.

# --- case study selection (overridden per job by --country/--asset) ----------
country: LUX          # ISO3 code, matches exposure file naming
asset_type: roads     # matches exposure file naming + curve/maxdam tables

# --- input data --------------------------------------------------------------
exposure_dir: "/scistor/ivm/eks510/MIRACA_EXPOSURE"
vulnerability_path: "/scistor/ivm/eks510/projects/AssetRisk_PanEU/data/Table_D2_Hazard_Fragility_and_Vulnerability_Curves_V1.1.0_conversions.xlsx"
fragility_path: "/scistor/ivm/eks510/projects/AssetRisk_PanEU/data/EQ_fragility.xlsx"
protection_standard_path: "/scistor/ivm/eks510/projects/AssetRisk_PanEU/data/floodProtection_v2019_paper3.tif"
basin_data_path: "/scistor/ivm/eks510/projects/AssetRisk_PanEU/data/basins_abs_shift_return_periods.parquet"

# --- hazards -----------------------------------------------------------------
# Which hazards apply to a given asset/country is decided by
# src/curves.py::applicable_hazards, NOT here - listing a hazard here only says
# where its data lives (windstorm is skipped for roads/ports, coastal for
# landlocked countries, automatically).
hazards:
  river:
    dir: "/scistor/ivm/eks510/Hazard_data/River_floods"
    filename_template: "Europe_RP{rp}_filled_depth.tif"
    return_periods: [10, 20, 30, 40, 50, 75, 100, 200, 500]
  earthquake:
    dir: "/scistor/ivm/eks510/Hazard_data/Earthquakes"
    filename_template: "PGA_1_{rp}_vs30.tif"
    return_periods: [50, 101, 476, 976, 2500, 5000]
  windstorm:
    dir: "/scistor/ivm/eks510/Hazard_data/Windstorms"
    filename_template: "{rp}yr_wisc_nao_0.59.tif"
    return_periods: [5, 10, 25, 50, 100, 250, 500]
  # Coastal flood is streamed from the remote CoCLiCo STAC catalogue, so it has
  # no dir/filename_template - it needs pystac-client/pystac installed AND
  # outbound network access on the compute node at preprocessing time.
  # If the compute nodes have no outbound network, drop this whole `coastal:`
  # block and the pipeline runs river/earthquake/windstorm only.
  coastal:
    kind: stac
    stac_url: "https://storage.googleapis.com/coclico-data-public/coclico/coclico-stac/catalog.json"
    collection: "cfhp_all"
    time_horizon: "2010"
    climate_scenario: "None"
    defence: "LOW_DEFENDED"
    # CoCLiCo cfhp_all only publishes return periods 1 / 100 / 1000 (the STAC
    # collection's summaries.rp = ['static','1','100','1000']). The earlier
    # 10/25/50/250/500 were never in the dataset, so they only injected phantom
    # zero-damage points into the EAD integral. Using exactly what the catalogue
    # serves puts every country on the same, data-matched RP grid.
    return_periods: [1, 100, 1000]
    # --- sea-level-rise states, sampled by the `slr` factor ---------------
    # Used ONLY by the *_slr scenarios. Each label names a CoCLiCo
    # (time, scenario) pair; Stage 1 writes one profile file per label,
    # {country}_{asset}_coastal_{label}_profiles.parquet, so the plain coastal
    # profiles above are never touched and the non-SLR scenarios are unaffected.
    #
    # The label matching the time_horizon/climate_scenario above reuses the
    # existing coastal profiles rather than re-extracting them, which saves a
    # full pass over the catalogue.
    #
    # High_End is published by CoCLiCo but deliberately excluded: it is a
    # low-likelihood tail branch, and under uniform sampling it would carry
    # the same weight as a central projection.
    slr_states:
      "2010_None": {time_horizon: "2010", climate_scenario: "None"}
      "2030_SSP126": {time_horizon: "2030", climate_scenario: "SSP126"}
      "2030_SSP245": {time_horizon: "2030", climate_scenario: "SSP245"}
      "2030_SSP585": {time_horizon: "2030", climate_scenario: "SSP585"}
      "2050_SSP126": {time_horizon: "2050", climate_scenario: "SSP126"}
      "2050_SSP245": {time_horizon: "2050", climate_scenario: "SSP245"}
      "2050_SSP585": {time_horizon: "2050", climate_scenario: "SSP585"}
      "2100_SSP126": {time_horizon: "2100", climate_scenario: "SSP126"}
      "2100_SSP245": {time_horizon: "2100", climate_scenario: "SSP245"}
      "2100_SSP585": {time_horizon: "2100", climate_scenario: "SSP585"}

    # 2025 release (Zenodo). The 2024 copy on the eks510 share leaves DE93 and
    # DE94 blank; 2025 gives both 100.045 yr, which also moves the German
    # country mean 145.17 -> 127.12. Kept in this repo rather than overwriting
    # the shared eks510 file, which other projects read.
    coastpros_path: "/scistor/ivm/yma794/Uncertainty-Modelling/data/COASTPROS-EU_2025.xlsx"
    nuts2_path: "/scistor/ivm/eks510/projects/AssetRisk_PanEU/data/NUTS_RG_01M_2024_3035.parquet"
    # NUTS 2024 dropped the United Kingdom entirely, so its 32 published
    # COASTPROS standards have no polygon to attach to. The 2016 vintage is
    # read for the UK regions alone - see sample_coastal_protection().
    nuts2_uk_path: "/scistor/ivm/eks510/projects/AssetRisk_PanEU/data/NUTS_RG_01M_2016_3035.geojson"
    protection_sheet: "COASTPROS-EU"
    protection_rp_col: "MODELLED RETURN PERIOD"
    protection_policy_col: "POLICY RETURN PERIOD"

# --- Sobol design ------------------------------------------------------------
# second_order: false samples N(k+2) rows (A, AB_i, B) instead of N(2k+2): S1 and
# ST are estimated exactly as before, S2 is not available. Applies to NEW
# samples only; existing archives are read in whichever layout they were
# written (src/sobol_design.py). Runs up to 2026-11-04 used true.
sobol:
  second_order: false

# --- outputs (relative to the repo folder) -----------------------------------
intermediate_dir: "data/intermediate"
results_dir: "results"
