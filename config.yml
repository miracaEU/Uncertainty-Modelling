# Configuration for the MIRACA uncertainty-modeling pipeline.
# Paths point at the SCISTOR storage mounted as S:\ on Windows
# (equivalent to /scistor/ivm/eks510 on the cluster).

# --- case study selection (minimal example) ---------------------------------
country: LUX          # ISO3 code, matches exposure file naming
asset_type: roads     # matches exposure file naming + curve/maxdam tables

# --- input data --------------------------------------------------------------
exposure_dir: "S:/eks510/MIRACA_EXPOSURE"
vulnerability_path: "S:/eks510/projects/AssetRisk_PanEU/data/Table_D2_Hazard_Fragility_and_Vulnerability_Curves_V1.1.0_conversions.xlsx"
fragility_path: "S:/eks510/projects/AssetRisk_PanEU/data/EQ_fragility.xlsx"
protection_standard_path: "S:/eks510/projects/AssetRisk_PanEU/data/floodProtection_v2019_paper3.tif"
basin_data_path: "S:/eks510/projects/AssetRisk_PanEU/data/basins_abs_shift_return_periods.parquet"

# --- hazards -----------------------------------------------------------------
# Every hazard the pipeline can model (local damage-curve + return-period
# rasters). Which of these actually apply to a given asset is decided per
# asset by src/curves.py::applicable_hazards, NOT here - listing a hazard
# here just tells the pipeline where its data lives:
#   river       - all assets
#   earthquake  - all assets
#   windstorm   - all assets except roads and ports, whose wind curve (W7.2)
#                 is identically zero, so they carry no windstorm damage and
#                 it is skipped for them automatically
#   coastal     - coastal countries only, and NOT local rasters: its maps are
#                 streamed from the CoCLiCo STAC catalogue (kind: stac), so it
#                 carries no dir/filename_template - see the block below
hazards:
  river:
    dir: "S:/eks510/Hazard_data/River_floods"
    filename_template: "Europe_RP{rp}_filled_depth.tif"
    return_periods: [10, 20, 30, 40, 50, 75, 100, 200, 500]
  earthquake:
    dir: "S:/eks510/Hazard_data/Earthquakes"
    filename_template: "PGA_1_{rp}_vs30.tif"
    return_periods: [50, 101, 476, 976, 2500, 5000]
  windstorm:
    dir: "S:/eks510/Hazard_data/Windstorms"
    filename_template: "{rp}yr_wisc_nao_0.59.tif"
    return_periods: [5, 10, 25, 50, 100, 250, 500]
  # Coastal flood is NOT local rasters: its maps are streamed from the remote
  # CoCLiCo STAC catalogue (kind: stac), so it has no dir/filename_template.
  # It reuses the river flood depth-damage curves and applies to coastal
  # countries only (landlocked countries are skipped - see curves.py). Needs
  # pystac-client/pystac installed and network access at preprocessing time.
  # Baseline present-day (2010) LOW_DEFENDED scenario; protection from the
  # local COASTPROS-EU table joined to NUTS2 regions.
  coastal:
    kind: stac
    stac_url: "https://storage.googleapis.com/coclico-data-public/coclico/coclico-stac/catalog.json"
    collection: "cfhp_all"
    time_horizon: "2010"
    climate_scenario: "None"
    defence: "LOW_DEFENDED"
    # CoCLiCo cfhp_all only publishes return periods 1 / 100 / 1000 (the STAC
    # collection's summaries.rp = ['static','1','100','1000']). The earlier
    # 10/25/50/250/500 were never in the dataset, so they only injected phantom
    # zero-damage points into the EAD integral. Using exactly what the catalogue
    # serves puts every country on the same, data-matched RP grid.
    return_periods: [1, 100, 1000]
    # --- sea-level-rise states, sampled by the `slr` factor ---------------
    # Used ONLY by the *_slr scenarios. Each label names a CoCLiCo
    # (time, scenario) pair; Stage 1 writes one profile file per label,
    # {country}_{asset}_coastal_{label}_profiles.parquet, so the plain coastal
    # profiles above are never touched and the non-SLR scenarios are unaffected.
    #
    # The label matching the time_horizon/climate_scenario above reuses the
    # existing coastal profiles rather than re-extracting them, which saves a
    # full pass over the catalogue.
    #
    # High_End is published by CoCLiCo but deliberately excluded: it is a
    # low-likelihood tail branch, and under uniform sampling it would carry
    # the same weight as a central projection.
    slr_states:
      "2010_None": {time_horizon: "2010", climate_scenario: "None"}
      "2030_SSP126": {time_horizon: "2030", climate_scenario: "SSP126"}
      "2030_SSP245": {time_horizon: "2030", climate_scenario: "SSP245"}
      "2030_SSP585": {time_horizon: "2030", climate_scenario: "SSP585"}
      "2050_SSP126": {time_horizon: "2050", climate_scenario: "SSP126"}
      "2050_SSP245": {time_horizon: "2050", climate_scenario: "SSP245"}
      "2050_SSP585": {time_horizon: "2050", climate_scenario: "SSP585"}
      "2100_SSP126": {time_horizon: "2100", climate_scenario: "SSP126"}
      "2100_SSP245": {time_horizon: "2100", climate_scenario: "SSP245"}
      "2100_SSP585": {time_horizon: "2100", climate_scenario: "SSP585"}

    coastpros_path: "S:/eks510/projects/AssetRisk_PanEU/data/COASTPROS-EU.xlsx"
    nuts2_path: "S:/eks510/projects/AssetRisk_PanEU/data/NUTS_RG_01M_2024_3035.parquet"
    protection_sheet: "COASTPROS-EU"
    protection_rp_col: "MODELLED RETURN PERIOD"

# --- outputs (relative to this project folder) -------------------------------
intermediate_dir: "data/intermediate"
results_dir: "results"
